name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # One gate, stated once, that every installing job waits on. It used to sit
  # inline in a single job, which meant the other jobs installed unchecked --
  # a check that finishes beside the thing it guards is a report, not a gate.
  # Prism raised the distinction 2026-09-21; this repo is polyglot, so the
  # JS job was gated and the PHP/Python ones were not.
  allowlist:
    name: Third-party allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  node:
    needs: allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # NOT `npm test --if-present`. A green tick over an absent suite is worse
      # than a red one, and this package's whole argument is about claims that
      # outrun the code.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  php:
    needs: allowlist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    steps:
      - uses: actions/checkout@v7

      # A missing toolchain is a FAILURE, not a skip. `skipIf(!HAS_PHP)`
      # returning green is the mechanism that hides two-way drift for months.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install
        run: composer install --no-interaction --prefer-dist

      # Pint is already a dev dependency and `composer lint` already ran it,
      # but nothing CALLED it, so three files drifted unnoticed. A style rule
      # that only exists in a composer script is a rule nobody is held to.
      - name: Style (pint)
        run: vendor/bin/pint --test

      - name: Test
        run: vendor/bin/pest
